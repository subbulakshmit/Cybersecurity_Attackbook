<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Attack Book | Network, OS, & Application Security Dossiers</title>
  <meta name="description" content="Interactive cyber security attack book covering Network Infrastructure, Operating System, and Application & Specialized Attacks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
  <!-- Top Global Navigation Bar -->
  <header class="top-nav">
    <div class="nav-brand">
      <div class="brand-shield">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">CYBER ATTACK BOOK</h1>
        <span class="brand-subtitle">68 Threat Vectors: Network • Core OS • App • Password • Wireless • Rogue AP • MAC • Mobile • IoT • Windows • Linux • macOS • Specialized</span>
      </div>
    </div>

    <div class="nav-metrics">
      <div class="metric-pill live-indicator">
        <span class="pulse-dot"></span>
        <span>DEFCON LEVEL 2</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">VECTORS:</span>
        <span class="metric-val" id="total-attacks-count">68</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">DEFENSE READINESS:</span>
        <span class="metric-val highlight" id="global-readiness-val">0%</span>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <!-- Sidebar: Attack Directory & Filters -->
    <aside class="sidebar" id="sidebar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search 68 attacks (name, MITRE, target)..." autocomplete="off">
        <button id="clear-search-btn" class="clear-btn" aria-label="Clear Search">&times;</button>
      </div>

      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">All (68)</button>
        <button class="filter-pill" data-filter="network">Network (01–05)</button>
        <button class="filter-pill" data-filter="os">Core OS (06–10)</button>
        <button class="filter-pill" data-filter="app">App / Web (11–15)</button>
        <button class="filter-pill" data-filter="pwd-attack">Password (31–35)</button>
        <button class="filter-pill" data-filter="pwd-crack">Cracking (36–39)</button>
        <button class="filter-pill" data-filter="wireless">Wireless (40–44)</button>
        <button class="filter-pill" data-filter="rogue">Rogue AP (45–49)</button>
        <button class="filter-pill" data-filter="mac">MAC / L2 (50–54)</button>
        <button class="filter-pill" data-filter="mobile">Mobile (55–59)</button>
        <button class="filter-pill" data-filter="iot">IoT (60–64)</button>
        <button class="filter-pill" data-filter="windows">Windows (65–69)</button>
        <button class="filter-pill" data-filter="linux">Linux (70–74)</button>
        <button class="filter-pill" data-filter="macos">macOS (75–79)</button>
        <button class="filter-pill" data-filter="os-spec">OS Specialized (80–83)</button>
      </div>

      <div class="attack-list" id="attack-list" role="navigation" aria-label="Attacks List">
        <!-- Rendered via app.js -->
      </div>

      <div class="sidebar-footer">
        <div class="compliance-badge">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 6v6l4 2"></path>
          </svg>
          <span>68 Threat Vectors Loaded</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area: Attack Dossier -->
    <main class="content-panel" id="main-content">
      <!-- Active Attack Header -->
      <section class="dossier-header" id="dossier-header">
        <!-- Rendered via app.js -->
      </section>

      <!-- View Navigation Tabs -->
      <nav class="dossier-tabs" id="dossier-tabs" role="tablist">
        <button class="tab-btn active" data-tab="anatomy" role="tab" id="tab-btn-anatomy">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          Attack Anatomy & Kill Chain
        </button>
        <button class="tab-btn" data-tab="detection" role="tab" id="tab-btn-detection">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          Detection Engineering & Rules
        </button>
        <button class="tab-btn" data-tab="defense" role="tab" id="tab-btn-defense">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Defense & Hardening Matrix
        </button>
      </nav>

      <!-- Tab Panels -->
      <div class="tab-content-container">
        <!-- 1. Attack Anatomy Tab -->
        <article class="tab-panel active" id="tab-anatomy">
        </article>
        <!-- 2. Detection Rules Tab -->
        <article class="tab-panel" id="tab-detection">
        </article>
        <!-- 3. Defense Matrix Tab -->
        <article class="tab-panel" id="tab-defense">
        </article>
      </div>
    </main>
  </div>

  <!-- Toast Notification for Copy Actions -->
  <div id="toast" class="toast" role="alert" aria-live="polite">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    <span id="toast-text">Rule copied to clipboard!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
